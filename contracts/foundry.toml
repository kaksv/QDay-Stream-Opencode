[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../web/lib/deployments" },
  { access = "read", path = "./broadcast" }
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 100
fail_on_revert = true

[profile.ci.fuzz]
runs = 4096

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
